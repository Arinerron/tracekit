[workspace]
resolver = "3"
members = ["crates/wire", "crates/procctx", "crates/bpfdoctor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/arinerron/tracekit"
readme = "README.md"

[workspace.dependencies]
tracekit-wire = { version = "0.1.0", path = "crates/wire" }
procctx = { version = "0.1.0", path = "crates/procctx" }
bpfdoctor = { version = "0.1.0", path = "crates/bpfdoctor" }

libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
