[package]
name = "bpfdoctor"
description = "Preflight and doctor checks for BPF tracing tools: detects missing configuration and prints the exact fix."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["ebpf", "bpf", "diagnostics", "capabilities", "preflight"]
categories = ["os::linux-apis", "development-tools::debugging"]

[features]
# Exposes `FixtureEnv` so tools can test their own checks against fixture trees.
testing = []

[dependencies]
libc.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Integration tests drive the checks through `FixtureEnv`.
bpfdoctor = { path = ".", features = ["testing"] }

[lints]
workspace = true
