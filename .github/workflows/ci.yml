name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the toolchain, components and musl target.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get install -y clang
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo clippy --workspace --lib --no-default-features
      - run: cargo test --workspace --all-features
      - run: cargo doc --workspace --no-deps --all-features
      - run: cargo build --workspace --target x86_64-unknown-linux-musl
      - run: cargo package --workspace

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.94 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo +1.94 check --workspace --all-targets --all-features
